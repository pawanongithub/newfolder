<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 600;
        }

        body {
            width: 100%;
            height: 100vh;
            /* this make calculator to the center*/
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(60deg, rgb(32, 31, 31), rgb(224, 107, 107));
        }

        .calculator {
            margin: 50px auto;
            background: #eca9b4;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 4);
        }

        #display {
            border: none;
            border-radius: 19px;
            height: 100px;
            width: 100%;
            padding: 20px;
            text-align: left;
            font-size: 29px;
        }

        .btn {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /*4 means column */
            gap: 6px;
            padding: 2px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 50px;
            height: 90px;
            width: 90px;
            font-size: 20px;
            font-weight: 600;
            /*bold*/
            cursor: pointer;
            background: #e05e5e;
            color: rgb(2, 22, 22);
            /*transition: all 0. 1s ease;*/

        }

        button:hover {
            background: #ff8686;
        }

        button:active {
            transform: scale(0.95);
        }

        /*  input {
            border-radius: 3px solid rgb(17, 16, 16);
        }

       

          .btn input {
            width: 15%;
            height: 80%;

        }*/
    </style>

</head>



<body>

    <div class="calculator">
        <input type="text" id="display">
        <div class="btn">
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="clearDisplay()" value="AC">AC</button>
            <button onclick="deleteLast()">C</button>
            <button onclick="appendToDisplay('/')">/</button>
        </div>


        <div class="btn">
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('*')">*</button>
        </div>
        <div class="btn">
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('-')">-</button>

        </div>
        <div class="btn">
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('+')">+</button>
        </div>
        <div class="btn">
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculate()" value="=">=</button>

            <button onclick="appendToDisplay('%')">%</button>
        </div>



    </div>

    <script src="script.js"></script>
</body>


</html>
